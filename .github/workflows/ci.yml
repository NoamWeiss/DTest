name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LDC and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Run self-tests
        run: dub run --compiler=ldc2 --config=selftest -- --dtest-xml=selftest_results.xml

      - name: Run example
        run: dub run --compiler=ldc2 --config=example

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: selftest_results.xml
